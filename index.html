<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
}

/* COMMON PAGE */
.page{
    position:absolute;
    inset:0;
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    background:url("images/background.png") no-repeat center/cover;
}

.hidden{ display:none; }

/* ENVELOPE */
.animated-envelope{
    width:100vw;
    height:100vh;
    object-fit:cover;
}

.opening{
    animation:openEnvelope 1.2s forwards;
}

@keyframes openEnvelope{
    0%{ transform:scale(1); opacity:1; }
    60%{ transform:scale(1.05) rotate(3deg); }
    100%{ transform:scale(1.25); opacity:0; }
}

/* BIRTHDAY */
#page2 h1{
    font-size:5rem;
    color:yellow;
    text-shadow:2px 2px 10px #000;
}

.floating{
    position:absolute;
    animation:float 6s ease-in-out infinite alternate;
}

@keyframes float{
    0%{ transform:translateY(0); }
    50%{ transform:translateY(-20px); }
    100%{ transform:translateY(0); }
}

.balloon{
    position:absolute;
    font-size:2rem;
    animation:rise linear infinite;
}

@keyframes rise{
    from{ transform:translateY(100vh); }
    to{ transform:translateY(-150px); }
}

/* PHOTO */
.photo-container{
    width:540px;
    height:330px;
}

.photo{
    width:100%;
    height:100%;
    object-fit:cover;
    border-radius:15px;
    box-shadow:0 0 25px rgba(0,0,0,0.6);
}

.typing{
    margin-top:20px;
    font-size:2rem;
    border-right:3px solid black;
    white-space:nowrap;
    overflow:hidden;
}

/* LETTER */
#page4{
    padding-top:40px;
    overflow-y:auto;
}

.letter{
    font-size:1.3rem;
    max-width:80%;
    line-height:1.8;
    text-align:center;
}
</style>
</head>

<body>

<!-- PAGE 1 : ENVELOPE (FIRST) -->
<div class="page" id="page1">
    <img src="images/envelope.gif" id="envelope" class="animated-envelope">
</div>

<!-- PAGE 2 : HAPPY BIRTHDAY -->
<div class="page hidden" id="page2">
    <h1>🎉 HAPPY BIRTHDAY 🎂</h1>

    <img src="images/bear1.png" class="floating" style="top:50px;left:50px;width:150px">
    <img src="images/bear2.png" class="floating" style="bottom:50px;right:50px;width:120px">

    <div class="balloon" style="left:120px;animation-duration:7s">🎈</div>
    <div class="balloon" style="left:300px;animation-duration:6s">🎈</div>
</div>

<!-- PAGE 3 : PHOTO -->
<div class="page hidden" id="page3">
    <div class="photo-container">
        <img src="images/photo.png" class="photo">
    </div>
    <div class="typing" id="typingPhoto"></div>
</div>

<!-- PAGE 4 : LETTER -->
<div class="page hidden" id="page4">
    <h2>My Letter to You 💌</h2>
    <div class="letter" id="letter"></div>
</div>

<audio id="bg-music" loop>
    <source src="song.mp3" type="audio/mpeg">
</audio>

<script>
window.onload = () => {

const page1 = document.getElementById("page1");
const page2 = document.getElementById("page2");
const page3 = document.getElementById("page3");
const page4 = document.getElementById("page4");
const envelope = document.getElementById("envelope");
const music = document.getElementById("bg-music");

/* STEP 1 — OPEN ENVELOPE */
setTimeout(() => {
    envelope.classList.add("opening");
}, 600);

/* STEP 2 — ENVELOPE → BIRTHDAY */
setTimeout(() => {
    page1.classList.add("hidden");
    page2.classList.remove("hidden");
    music.play().catch(()=>{});
}, 2200);

/* STEP 3 — BIRTHDAY → PHOTO */
setTimeout(() => {
    page2.classList.add("hidden");
    page3.classList.remove("hidden");
    typePhoto();
}, 7000);

/* STEP 4 — PHOTO → LETTER */
setTimeout(() => {
    page3.classList.add("hidden");
    page4.classList.remove("hidden");
    typeLetter();
}, 13000);

/* PHOTO TYPING */
const typing = document.getElementById("typingPhoto");
const photoText = "You're my favorite person! 💖";
let i = 0;

function typePhoto(){
    if(i < photoText.length){
        typing.innerHTML += photoText.charAt(i++);
        setTimeout(typePhoto, 120);
    }
}

/* LETTER TYPING */
const letter = document.getElementById("letter");
const lines = [
    "Uhmmmmm uhmmm you r the soul straight from a fairy tale 🎀💎",
    "The costliest gem I own, my muffin my cupcake 🧁",
    "Mera bear 💖",
    "",
    "It took 11 years to be friends 🌝🛐",
    "It was meant to be !!!!",
    "",
    "FROM ME TO YOU IN EVERY UNIVERSE 💫",
    "MWAHHHHHHH 💗"
];

let line = 0;

function typeLetter(){
    if(line < lines.length){
        let text = lines[line];
        let c = 0;

        function typeChar(){
            if(c < text.length){
                letter.innerHTML += text.charAt(c++);
                setTimeout(typeChar, 50);
            }else{
                letter.innerHTML += "<br>";
                line++;
                setTimeout(typeLetter, 400);
            }
        }
        typeChar();
    }
}

};
</script>

</body>
</html>
